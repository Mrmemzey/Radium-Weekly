<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hdza's Radium Weekly</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800;900&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --or:#FF6B1A;--or2:#FF4500;--or3:#FF8C42;--or4:#FFB347;
  --bg:#0A0603;--bg2:#120A05;--bg3:#1A0E07;--card:#1C1008;
  --bdr:#3A1E0C;--bdr2:#FF6B1A44;--bdr3:#FF6B1A88;
  --tx:#F5E8D6;--txm:#A07850;--txd:#5A3A20;
  --gn:#4ADE80;--bl:#60A5FA;--pu:#C084FC;--yw:#FCD34D;--rd:#F87171;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden;position:relative}

/* ── BACKGROUND LAYERS ── */
#bg-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.vignette{position:fixed;inset:0;background:radial-gradient(ellipse 90% 80% at 50% 50%,transparent 30%,rgba(10,6,3,0.85) 100%);z-index:1;pointer-events:none}
.grid-ov{position:fixed;inset:0;background-image:linear-gradient(rgba(58,30,12,0.35) 1px,transparent 1px),linear-gradient(90deg,rgba(58,30,12,0.35) 1px,transparent 1px);background-size:48px 48px;z-index:2;pointer-events:none}
.orb{position:fixed;border-radius:50%;pointer-events:none;z-index:2;filter:blur(90px);animation:orbF 9s ease-in-out infinite}
.orb1{width:500px;height:500px;background:rgba(255,107,26,0.06);top:-150px;left:-120px;animation-delay:0s}
.orb2{width:350px;height:350px;background:rgba(255,69,0,0.05);bottom:-80px;right:-80px;animation-delay:4s}
.orb3{width:250px;height:250px;background:rgba(255,179,71,0.04);top:40%;left:55%;animation-delay:7s}
@keyframes orbF{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-24px) scale(1.06)}}

/* ── LAYOUT ── */
.wrap{position:relative;z-index:10;max-width:940px;margin:0 auto;padding:0 20px 100px}

/* ── HEADER ── */
header{padding:52px 0 36px;text-align:center}
.bean-wrap{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:14px}
.bean-icon{width:72px;height:72px;filter:drop-shadow(0 0 22px rgba(255,107,26,0.75));animation:beanBob 3.2s ease-in-out infinite}
@keyframes beanBob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
.site-title{font-family:'Baloo 2',cursive;font-size:clamp(28px,7vw,58px);font-weight:900;background:linear-gradient(130deg,#FFD080 0%,#FF9A42 25%,#FF6B1A 55%,#FF3D00 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.05;letter-spacing:-1px;margin-bottom:4px}
.title-sub{font-size:12px;font-weight:700;color:var(--txm);letter-spacing:0.14em;text-transform:uppercase;margin-bottom:16px}
.hdr-badges{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 13px;border-radius:30px;font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;white-space:nowrap}
.b-or{background:rgba(255,107,26,0.13);border:1px solid var(--bdr2);color:var(--or3)}
.b-gn{background:rgba(74,222,128,0.10);border:1px solid rgba(74,222,128,0.28);color:var(--gn)}
.b-rd{background:rgba(248,113,113,0.10);border:1px solid rgba(248,113,113,0.28);color:var(--rd)}
.b-yw{background:rgba(252,211,77,0.10);border:1px solid rgba(252,211,77,0.28);color:var(--yw)}
.pulse-dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;animation:pls 1.5s ease-in-out infinite}
@keyframes pls{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.3;transform:scale(0.6)}}

/* ── DIVIDER ── */
.divider{height:1px;background:linear-gradient(90deg,transparent,var(--bdr3),transparent);margin:28px 0;position:relative}
.divider::after{content:'⬡';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:var(--or);font-size:13px;background:var(--bg);padding:0 10px}

/* ── TOP BAR ── */
.top-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.top-bar-left{font-size:12px;color:var(--txd)}
.top-bar-left em{color:var(--txm);font-style:normal}
.refresh-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;background:rgba(255,107,26,0.08);border:1px solid var(--bdr2);border-radius:8px;color:var(--or3);font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:background .2s,border-color .2s;letter-spacing:0.03em}
.refresh-btn:hover{background:rgba(255,107,26,0.18);border-color:var(--bdr3)}

/* ── CHALLENGE HERO ── */
.challenge-hero{background:var(--card);border:1px solid var(--bdr);border-radius:22px;padding:32px 36px 28px;margin-bottom:22px;position:relative;overflow:hidden;animation:fadeUp .4s ease both}
.challenge-hero::before{content:'';position:absolute;top:-50px;right:-50px;width:260px;height:260px;background:radial-gradient(circle,rgba(255,107,26,0.13) 0%,transparent 70%);pointer-events:none}
.challenge-hero::after{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--or2),var(--or),var(--or3),var(--or4),var(--or3),var(--or),var(--or2));background-size:300% 100%;animation:shimmer 3.5s linear infinite}
@keyframes shimmer{0%{background-position:0%}100%{background-position:300%}}
.ch-meta{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.ch-title{font-family:'Baloo 2',cursive;font-size:clamp(22px,4.5vw,38px);font-weight:900;color:var(--tx);line-height:1.15;margin-bottom:10px}
.ch-desc{color:var(--txm);font-size:14px;line-height:1.8;max-width:720px;margin-bottom:16px}

/* countdown */
.countdown-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.cd-box{background:var(--bg3);border:1px solid var(--bdr);border-radius:12px;padding:12px 18px;text-align:center;min-width:68px;position:relative;overflow:hidden}
.cd-box::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,107,26,0.04) 0%,transparent 100%)}
.cd-num{font-family:'Baloo 2',cursive;font-size:28px;font-weight:900;color:var(--or3);line-height:1}
.cd-lbl{font-size:9px;font-weight:700;color:var(--txd);text-transform:uppercase;letter-spacing:0.12em;margin-top:2px}

/* progress */
.prog-wrap{margin-top:18px}
.prog-track{height:9px;background:var(--bg3);border-radius:20px;overflow:hidden;border:1px solid var(--bdr)}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--or2),var(--or3));border-radius:20px;position:relative;overflow:hidden}
.prog-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.22) 50%,transparent 100%);animation:scan 2.2s linear infinite}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(200%)}}
.prog-meta{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--txd)}

/* ── STATS GRID ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin-bottom:22px}
.stat-card{background:var(--card);border:1px solid var(--bdr);border-radius:14px;padding:18px 20px;position:relative;overflow:hidden;animation:fadeUp .4s ease both;transition:border-color .2s,transform .2s}
.stat-card:hover{border-color:var(--bdr2);transform:translateY(-3px)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0}
.stat-card.c-or::before{background:linear-gradient(90deg,var(--or2),var(--or4))}
.stat-card.c-gn::before{background:var(--gn)}
.stat-card.c-bl::before{background:var(--bl)}
.stat-card.c-pu::before{background:var(--pu)}
.stat-card.c-yw::before{background:var(--yw)}
.stat-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--txd);margin-bottom:6px}
.stat-value{font-family:'Baloo 2',cursive;font-size:26px;font-weight:900;line-height:1.1}
.stat-value.c-or{color:var(--or3)}.stat-value.c-gn{color:var(--gn)}.stat-value.c-bl{color:var(--bl)}.stat-value.c-pu{color:var(--pu)}.stat-value.c-yw{color:var(--yw)}.stat-value.c-def{color:var(--tx)}

/* ── SECTIONS ── */
.section{background:var(--card);border:1px solid var(--bdr);border-radius:18px;padding:24px 28px;margin-bottom:16px;animation:fadeUp .5s ease both}
.sec-title{font-family:'Baloo 2',cursive;font-size:13px;font-weight:800;color:var(--or3);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.sec-icon{font-size:16px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--bdr);margin-left:4px}
.kv-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:9px 0;border-bottom:1px solid var(--bdr);font-size:13px}
.kv-row:last-child{border-bottom:none;padding-bottom:0}
.kv-key{color:var(--txm);font-weight:700;flex-shrink:0;min-width:140px}
.kv-val{color:var(--tx);text-align:right;word-break:break-word;font-weight:600}
.kv-val a{color:var(--bl);text-decoration:none}
.kv-val a:hover{text-decoration:underline}
.bool-t{color:var(--gn)!important}.bool-f{color:var(--rd)!important}.date-v{color:var(--yw)!important}

/* nested object → mini table inside kv-val */
.nested-tbl{width:100%;border-collapse:collapse;margin-top:4px;text-align:left}
.nested-tbl td{padding:4px 8px;font-size:12px;border:1px solid var(--bdr);vertical-align:top}
.nested-tbl td:first-child{color:var(--txm);font-weight:700;white-space:nowrap;width:44%;background:var(--bg3)}
.nested-tbl td:last-child{color:var(--tx);word-break:break-word}

/* array pills */
.arr-wrap{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.arr-pill{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:var(--bg3);border:1px solid var(--bdr);color:var(--txm)}

/* array of objects */
.obj-arr{display:flex;flex-direction:column;gap:8px;width:100%}
.obj-arr-item{background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;padding:10px 14px}
.obj-arr-item .kv-row{padding:4px 0;font-size:12px}

/* ── STATES ── */
.state-box{text-align:center;padding:90px 20px}
.spinner{width:54px;height:54px;border-radius:50%;border:3px solid var(--bdr);border-top-color:var(--or);animation:spin .8s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
.state-box p{color:var(--txm);font-size:14px}
.retry-btn{margin-top:18px;padding:10px 24px;background:var(--or);color:#fff;border:none;border-radius:10px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:background .2s}
.retry-btn:hover{background:var(--or3)}

/* ── FOOTER ── */
footer{text-align:center;padding:28px 0 0;color:var(--txd);font-size:12px;border-top:1px solid var(--bdr)}
footer a{color:var(--or);text-decoration:none}
footer a:hover{text-decoration:underline}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.challenge-hero{animation-delay:.05s}
.stats-grid .stat-card:nth-child(1){animation-delay:.10s}.stats-grid .stat-card:nth-child(2){animation-delay:.15s}
.stats-grid .stat-card:nth-child(3){animation-delay:.20s}.stats-grid .stat-card:nth-child(4){animation-delay:.25s}
.stats-grid .stat-card:nth-child(5){animation-delay:.30s}.stats-grid .stat-card:nth-child(6){animation-delay:.35s}
.section:nth-of-type(1){animation-delay:.38s}.section:nth-of-type(2){animation-delay:.43s}
.section:nth-of-type(3){animation-delay:.48s}.section:nth-of-type(4){animation-delay:.53s}
.section:nth-of-type(5){animation-delay:.58s}.section:nth-of-type(6){animation-delay:.63s}

@media(max-width:520px){
  .challenge-hero{padding:20px}.section{padding:16px 18px}
  .kv-key{min-width:100px}.countdown-row{gap:6px}
  .cd-box{min-width:54px;padding:9px 12px}.cd-num{font-size:22px}
}
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<div class="vignette"></div>
<div class="grid-ov"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="wrap">

  <header>
    <div class="bean-wrap">
      <!-- Rec Room Bean SVG -->
      <svg class="bean-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bg1" cx="40%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#FFB347" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#FF4500" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <!-- body -->
        <ellipse cx="32" cy="37" rx="20" ry="21" fill="#FF6B1A"/>
        <ellipse cx="32" cy="37" rx="20" ry="21" fill="url(#bg1)"/>
        <!-- head -->
        <ellipse cx="32" cy="19" rx="13" ry="11" fill="#FF8C42"/>
        <!-- visor -->
        <ellipse cx="32" cy="21" rx="10" ry="7" fill="#1A0D05"/>
        <ellipse cx="32" cy="21" rx="8" ry="5.5" fill="#0D2744"/>
        <ellipse cx="32" cy="21" rx="6" ry="4" fill="#1A3D6B"/>
        <ellipse cx="28" cy="19" rx="2.5" ry="1.5" fill="rgba(255,255,255,0.28)" transform="rotate(-15 28 19)"/>
        <!-- arms -->
        <ellipse cx="12" cy="37" rx="5" ry="8" fill="#FF5500" transform="rotate(20 12 37)"/>
        <ellipse cx="52" cy="37" rx="5" ry="8" fill="#FF5500" transform="rotate(-20 52 37)"/>
        <!-- legs -->
        <ellipse cx="25" cy="55" rx="5" ry="7" fill="#FF5500" transform="rotate(-10 25 55)"/>
        <ellipse cx="39" cy="55" rx="5" ry="7" fill="#FF5500" transform="rotate(10 39 55)"/>
      </svg>
      <h1 class="site-title">hdza's Radium Weekly</h1>
    </div>
    <p class="title-sub">Your weekly challenge hub &nbsp;·&nbsp; Powered by Radium</p>
    <div class="hdr-badges">
      <span class="badge b-or">⚡ Radium</span>
      <span class="badge b-gn" id="live-badge"><span class="pulse-dot"></span>&nbsp;Loading…</span>
    </div>
  </header>

  <div class="divider"></div>

  <div id="content">
    <div class="state-box">
      <div class="spinner"></div>
      <p>Grabbing this week's challenge…</p>
    </div>
  </div>

  <footer>
    <p>Crafted by <a href="#">hdza</a> &nbsp;·&nbsp; Powered by <a href="https://www.radie.app/" target="_blank">Radium</a> &nbsp;·&nbsp; Not affiliated with Rec Room Inc.</p>
  </footer>
</div>

<script>
/* ════════════════════════════════════════════
   ANIMATED CANVAS BACKGROUND
   Diagonal scrolling tiled Rec Room logos
════════════════════════════════════════════ */
(function(){
  const cv = document.getElementById('bg-canvas');
  const cx = cv.getContext('2d');
  let W, H, off = 0;
  const TILE = 170, SPEED = 0.4, ANGLE = -Math.PI / 5;

  function resize(){ W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  function drawBean(x, y, alpha, scale){
    cx.save();
    cx.globalAlpha = alpha;
    cx.translate(x, y);
    cx.rotate(ANGLE);
    cx.scale(scale, scale);

    /* outer ring */
    cx.beginPath();
    cx.arc(0, 0, 32, 0, Math.PI*2);
    cx.strokeStyle = 'rgba(255,107,26,0.18)';
    cx.lineWidth = 1.5;
    cx.stroke();
    cx.fillStyle = 'rgba(255,107,26,0.05)';
    cx.fill();

    /* bean body */
    cx.save();
    cx.scale(0.55, 0.55);
    // body
    cx.beginPath();
    cx.ellipse(0, 9, 13, 14, 0, 0, Math.PI*2);
    cx.fillStyle = 'rgba(255,107,26,0.22)';
    cx.fill();
    // head
    cx.beginPath();
    cx.ellipse(0, -6, 8.5, 7, 0, 0, Math.PI*2);
    cx.fillStyle = 'rgba(255,140,66,0.22)';
    cx.fill();
    // visor
    cx.beginPath();
    cx.ellipse(0, -5, 6, 4, 0, 0, Math.PI*2);
    cx.fillStyle = 'rgba(30,100,180,0.15)';
    cx.fill();
    // arms
    cx.save(); cx.translate(-14, 9); cx.rotate(0.35);
    cx.beginPath(); cx.ellipse(0,0,3,5,0,0,Math.PI*2);
    cx.fillStyle = 'rgba(255,85,0,0.18)'; cx.fill(); cx.restore();
    cx.save(); cx.translate(14, 9); cx.rotate(-0.35);
    cx.beginPath(); cx.ellipse(0,0,3,5,0,0,Math.PI*2);
    cx.fillStyle = 'rgba(255,85,0,0.18)'; cx.fill(); cx.restore();
    cx.restore();

    /* RR text */
    cx.fillStyle = 'rgba(255,160,80,0.22)';
    cx.font = 'bold 13px sans-serif';
    cx.textAlign = 'center';
    cx.textBaseline = 'middle';
    cx.fillText('RR', 0, 0);

    cx.restore();
  }

  function frame(){
    cx.clearRect(0, 0, W, H);
    const cols = Math.ceil(W / TILE) + 6;
    const rows = Math.ceil(H / TILE) + 6;
    for(let r = -3; r < rows; r++){
      for(let c = -3; c < cols; c++){
        const stagger = (r % 2 === 0) ? 0 : TILE / 2;
        const x = c * TILE + stagger + (off % TILE);
        const y = r * TILE;
        const scale = 0.7 + 0.3 * Math.sin((r + c) * 0.8);
        drawBean(x, y, 1, scale);
      }
    }
    off += SPEED;
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ════════════════════════════════════════════
   HELPERS
════════════════════════════════════════════ */
const API = 'https://launcher.radie.app/challenge/active';

function isISO(v){ return typeof v==='string' && /^\d{4}-\d{2}-\d{2}T/.test(v); }
function fmtDate(v){
  const d = new Date(v);
  if(isNaN(d)) return esc(v);
  return d.toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function lbl(k){
  return k.replace(/_/g,' ').replace(/([a-z])([A-Z])/g,'$1 $2').replace(/\b\w/g,c=>c.toUpperCase());
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* renderVal — recursively handles any JSON value without [object Object] */
function renderVal(v){
  if(v === null || v === undefined){
    return '<span style="color:var(--txd)">—</span>';
  }
  if(typeof v === 'boolean'){
    return v
      ? '<span class="bool-t">✔ Yes</span>'
      : '<span class="bool-f">✗ No</span>';
  }
  if(typeof v === 'number'){
    return esc(v.toLocaleString());
  }
  if(typeof v === 'string'){
    if(isISO(v)) return '<span class="date-v">' + fmtDate(v) + '</span>';
    if(/^https?:\/\//.test(v)) return '<a href="' + esc(v) + '" target="_blank">' + esc(v) + '</a>';
    return esc(v);
  }
  if(Array.isArray(v)){
    if(v.length === 0) return '<span style="color:var(--txd)">Empty list</span>';
    /* all primitives → pills */
    if(v.every(x => x === null || typeof x !== 'object')){
      return '<div class="arr-wrap">' +
        v.map(x => '<span class="arr-pill">' + renderVal(x) + '</span>').join('') +
        '</div>';
    }
    /* array of objects → mini cards */
    return '<div class="obj-arr">' +
      v.map(function(item){
        if(item === null || typeof item !== 'object'){
          return '<div class="obj-arr-item">' + renderVal(item) + '</div>';
        }
        return '<div class="obj-arr-item">' +
          Object.entries(item).map(function(pair){
            return '<div class="kv-row">' +
              '<span class="kv-key">' + esc(lbl(pair[0])) + '</span>' +
              '<span class="kv-val">' + renderVal(pair[1]) + '</span>' +
              '</div>';
          }).join('') +
          '</div>';
      }).join('') +
      '</div>';
  }
  if(typeof v === 'object'){
    /* plain object → nested mini table */
    var rows = Object.entries(v).map(function(pair){
      return '<tr><td>' + esc(lbl(pair[0])) + '</td><td>' + renderVal(pair[1]) + '</td></tr>';
    }).join('');
    return '<table class="nested-tbl">' + rows + '</table>';
  }
  return esc(String(v));
}

/* countdown clock */
var _cdTicker = null;
function startCountdown(endStr){
  clearInterval(_cdTicker);
  function tick(){
    var diff = new Date(endStr) - Date.now();
    if(diff <= 0){ diff = 0; clearInterval(_cdTicker); }
    var d = Math.floor(diff/86400000);
    var h = Math.floor((diff%86400000)/3600000);
    var m = Math.floor((diff%3600000)/60000);
    var s = Math.floor((diff%60000)/1000);
    function set(id,val){ var el=document.getElementById(id); if(el) el.textContent=String(val).padStart(2,'0'); }
    set('cd-d',d); set('cd-h',h); set('cd-m',m); set('cd-s',s);
  }
  tick();
  _cdTicker = setInterval(tick, 1000);
}

/* stat colour */
function statCol(k){
  k = k.toLowerCase();
  if(/points|score|reward|token|coin|xp/.test(k)) return 'c-or';
  if(/complete|finish|winner|done|success/.test(k)) return 'c-gn';
  if(/player|user|participant|entry|submit|count|member/.test(k)) return 'c-bl';
  if(/rank|level|tier|place/.test(k)) return 'c-pu';
  if(/time|date|deadline|end|start|week|expire/.test(k)) return 'c-yw';
  return 'c-def';
}

/* ════════════════════════════════════════════
   RENDER ONE CHALLENGE OBJECT
════════════════════════════════════════════ */
var STAT_KEYS = ['points_reward','max_entries','total_submissions','participants',
  'entries','reward','weekly_points','challenge_points','total_players','submissions',
  'token_reward','coins','xp_reward','score','total_entries','completion_count'];

var SKIP_MAIN = {name:1,title:1,challenge_name:1,challenge_title:1,
  description:1,details:1,active:1,status:1,id:1,_id:1,uuid:1,slug:1};

var DATE_KEYS = {start_date:1,starts_at:1,start:1,end_date:1,ends_at:1,end:1,
  created_at:1,updated_at:1,deadline:1,expires_at:1,started_at:1,ended_at:1,week_start:1,week_end:1};

function renderChallenge(data){
  var name = data.name || data.title || data.challenge_name || data.challenge_title || 'Active Challenge';
  var desc = data.description || data.details || '';
  var id   = data.id || data._id || data.uuid || data.slug || '';

  /* live badge */
  var lbEl = document.getElementById('live-badge');
  var isActive = data.active === true || (typeof data.status==='string' && data.status.toLowerCase()==='active');
  lbEl.innerHTML = '<span class="pulse-dot"></span>&nbsp;' + (isActive ? 'Live' : 'Offline');
  lbEl.className = 'badge ' + (isActive ? 'b-gn' : 'b-rd');

  /* progress bar */
  var startRaw = data.start_date||data.starts_at||data.start||data.week_start;
  var endRaw   = data.end_date||data.ends_at||data.end||data.week_end;
  var progHTML = '';
  if(startRaw && endRaw){
    var s=new Date(startRaw),e=new Date(endRaw),n=Date.now();
    var pct = Math.min(100,Math.max(0,Math.round(((n-s)/(e-s))*100)));
    progHTML = '<div class="prog-wrap">' +
      '<div class="prog-track"><div class="prog-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="prog-meta"><span>' + fmtDate(startRaw) + '</span><span>' + pct + '% elapsed</span><span>' + fmtDate(endRaw) + '</span></div>' +
      '</div>';
  }

  /* countdown */
  var cdHTML = '';
  if(endRaw){
    cdHTML = '<div class="countdown-row">' +
      '<div class="cd-box"><div class="cd-num" id="cd-d">--</div><div class="cd-lbl">Days</div></div>' +
      '<div class="cd-box"><div class="cd-num" id="cd-h">--</div><div class="cd-lbl">Hours</div></div>' +
      '<div class="cd-box"><div class="cd-num" id="cd-m">--</div><div class="cd-lbl">Mins</div></div>' +
      '<div class="cd-box"><div class="cd-num" id="cd-s">--</div><div class="cd-lbl">Secs</div></div>' +
      '</div>';
  }

  /* stat cards */
  var statHits = [];
  STAT_KEYS.forEach(function(k){ if(data[k] != null) statHits.push([k, data[k]]); });
  Object.entries(data).forEach(function(pair){
    var k=pair[0], v=pair[1];
    if(typeof v==='number' && !STAT_KEYS.includes(k) && !SKIP_MAIN[k]) statHits.push([k,v]);
  });
  var statsHTML = '';
  if(statHits.length > 0){
    statsHTML = '<div class="stats-grid">' +
      statHits.slice(0,6).map(function(pair){
        var k=pair[0], v=pair[1], cc=statCol(k);
        return '<div class="stat-card ' + cc + '">' +
          '<div class="stat-label">' + esc(lbl(k)) + '</div>' +
          '<div class="stat-value ' + cc + '">' + (typeof v==='number' ? v.toLocaleString() : esc(String(v))) + '</div>' +
          '</div>';
      }).join('') +
      '</div>';
  }

  /* partition the remaining fields */
  var infoRows = [], dateRows = [], objSecs = '', arrSecs = '';
  Object.entries(data).forEach(function(pair){
    var k=pair[0], v=pair[1];
    if(SKIP_MAIN[k]) return;
    if(STAT_KEYS.includes(k) && typeof v==='number') return;
    if(Array.isArray(v)){
      /* render as its own section */
      arrSecs += '<div class="section">' +
        '<div class="sec-title"><span class="sec-icon">🏷</span>' + esc(lbl(k)) + '</div>' +
        '<div>' + renderVal(v) + '</div>' +
        '</div>';
      return;
    }
    if(typeof v==='object' && v!==null){
      /* render nested object as its own section */
      objSecs += '<div class="section">' +
        '<div class="sec-title"><span class="sec-icon">📦</span>' + esc(lbl(k)) + '</div>' +
        Object.entries(v).map(function(p2){
          return '<div class="kv-row">' +
            '<span class="kv-key">' + esc(lbl(p2[0])) + '</span>' +
            '<span class="kv-val">' + renderVal(p2[1]) + '</span>' +
            '</div>';
        }).join('') +
        '</div>';
      return;
    }
    if(DATE_KEYS[k] || isISO(String(v))){
      dateRows.push(pair); return;
    }
    infoRows.push(pair);
  });

  function sec(title, icon, rows){
    if(!rows.length) return '';
    return '<div class="section">' +
      '<div class="sec-title"><span class="sec-icon">' + icon + '</span>' + title + '</div>' +
      rows.map(function(pair){
        return '<div class="kv-row">' +
          '<span class="kv-key">' + esc(lbl(pair[0])) + '</span>' +
          '<span class="kv-val">' + renderVal(pair[1]) + '</span>' +
          '</div>';
      }).join('') +
      '</div>';
  }

  return (
    '<div class="top-bar">' +
      '<div class="top-bar-left">Updated: <em>' + new Date().toLocaleTimeString() + '</em></div>' +
      '<button class="refresh-btn" onclick="loadData()">↻ Refresh</button>' +
    '</div>' +

    '<div class="challenge-hero">' +
      '<div class="ch-meta">' +
        '<span class="badge b-or">⚡ Weekly Challenge</span>' +
        (id ? '<span class="badge" style="background:var(--bg3);border:1px solid var(--bdr);color:var(--txd)">ID: ' + esc(String(id)) + '</span>' : '') +
        (isActive ? '<span class="badge b-gn"><span class="pulse-dot"></span>&nbsp;Active</span>' : '') +
      '</div>' +
      '<div class="ch-title">' + esc(String(name)) + '</div>' +
      (desc ? '<div class="ch-desc">' + esc(String(desc)) + '</div>' : '') +
      progHTML +
      cdHTML +
    '</div>' +

    statsHTML +
    sec('Challenge Details', '🎮', infoRows) +
    sec('Dates &amp; Times', '📅', dateRows) +
    arrSecs +
    objSecs
  );
}

/* ════════════════════════════════════════════
   LOAD DATA
════════════════════════════════════════════ */
function loadData(){
  var content = document.getElementById('content');
  content.innerHTML = '<div class="state-box"><div class="spinner"></div><p>Grabbing this week\'s challenge…</p></div>';
  var lb = document.getElementById('live-badge');
  lb.innerHTML = '<span class="pulse-dot"></span>&nbsp;Loading…';
  lb.className = 'badge b-or';

  fetch(API, {headers:{'Accept':'application/json'}})
    .then(function(res){
      if(!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
      return res.json();
    })
    .then(function(raw){
      var html = '';
      if(Array.isArray(raw)){
        if(raw.length === 0){
          html = '<div class="state-box"><p style="color:var(--txm);font-size:16px">No active challenges right now. Check back soon! 🕹️</p></div>';
        } else {
          var firstEnd = null;
          html = raw.map(function(item, i){
            if(!firstEnd) firstEnd = item.end_date||item.ends_at||item.end||item.week_end;
            return (i > 0 ? '<div class="divider"></div>' : '') +
              (raw.length > 1 ? '<p style="font-family:\'Baloo 2\',cursive;font-size:13px;color:var(--or3);font-weight:800;opacity:0.6;margin-bottom:8px">Challenge ' + (i+1) + ' of ' + raw.length + '</p>' : '') +
              renderChallenge(item);
          }).join('');
          if(firstEnd) setTimeout(function(){ startCountdown(firstEnd); }, 50);
        }
      } else if(typeof raw === 'object' && raw !== null){
        html = renderChallenge(raw);
        var endStr = raw.end_date||raw.ends_at||raw.end||raw.week_end;
        if(endStr) setTimeout(function(){ startCountdown(endStr); }, 50);
      } else {
        html = '<div class="section"><div class="sec-title">Raw Response</div><pre style="color:var(--or3);font-size:12px;white-space:pre-wrap;word-break:break-word">' + esc(JSON.stringify(raw, null, 2)) + '</pre></div>';
      }
      content.innerHTML = html;
    })
    .catch(function(err){
      console.error(err);
      var lb2 = document.getElementById('live-badge');
      lb2.innerHTML = '<span class="pulse-dot" style="background:var(--rd)"></span>&nbsp;Error';
      lb2.className = 'badge b-rd';
      content.innerHTML =
        '<div class="state-box">' +
        '<div style="font-size:48px;margin-bottom:14px">⚠️</div>' +
        '<p style="color:var(--tx);font-size:16px;font-weight:700;margin-bottom:8px">Couldn\'t load challenge data</p>' +
        '<p style="color:var(--txm);font-size:13px">' + esc(err.message) + '</p>' +
        '<button class="retry-btn" onclick="loadData()">Try Again</button>' +
        '</div>';
    });
}

loadData();
</script>

</html>
